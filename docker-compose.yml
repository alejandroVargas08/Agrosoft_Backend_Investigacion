version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    container_name: Agrosoft_DB
    volumes:
      - ./postgres:/var/lib/postgresql/data
